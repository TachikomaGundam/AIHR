[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agent"
version = "0.2.0"
description = "HR Agent (人事) — model evaluation and role assignment for oh-my-openagent"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # compatible-release bounds derived from the versions proven by this
    # suite at commit time (pip show, 2026-08-31): the lockfile installs
    # exactly these; the ~= floor prevents a future resolver from drifting
    # outside the tested major.minor
    "typer~=0.27",
    "rich~=13.9",
    "httpx~=0.28",
    "pydantic~=2.13",
    "psycopg2-binary~=2.9",
    "numpy~=2.5",
    "pyyaml~=6.0",
    "requests~=2.32",
]

[project.optional-dependencies]
test = [
    "basedpyright~=1.39",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-timeout~=2.4",
    "ruff~=0.16",
]
# Vision item authoring toolchain (itemrepo/vision): drawing primitives load
# lazily, so the core package never imports Pillow; install this extra to
# regenerate vision items.
vision = ["pillow~=12.1"]

[project.scripts]
hr = "hr.cli:app"

[tool.setuptools.packages.find]
include = ["hr*"]
exclude = ["hr.hr*"]

[tool.setuptools.data-files]
"share/hr-agent/configs" = [
    "configs/deployable.yaml",
    "configs/fleet.yaml",
    "configs/hr.toml.example",
    "configs/knowledge.yaml",
    "configs/models.yaml",
    "configs/seats.yaml",
    "configs/thresholds.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--timeout=300"]
markers = [
    "db: requires live postgres (env/service-gated)",
    "integration: exercises real external resources (postgres)",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportImportCycles = false
reportMissingTypeArgument = false

[tool.coverage.run]
branch = true
source = ["hr"]
