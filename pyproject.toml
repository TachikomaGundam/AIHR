[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihr"
version = "0.6.9"
description = "HR Agent (人事) — model evaluation and role assignment for oh-my-openagent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "TachikomaGundam" }]
keywords = [
    "llm",
    "model-evaluation",
    "benchmark",
    "benchmarking",
    "livebench",
    "role-assignment",
    "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { "Homepage" = "https://github.com/TachikomaGundam/AIHR", "Repository" = "https://github.com/TachikomaGundam/AIHR", "Issues" = "https://github.com/TachikomaGundam/AIHR/issues" }

dependencies = [
    # compatible-release bounds derived from the versions proven by this
    # suite at commit time (pip show, 2026-08-31): the lockfile installs
    # exactly these; the ~= floor prevents a future resolver from drifting
    # outside the tested major.minor
    "typer~=0.27",
    "rich~=13.9",
    "httpx~=0.28",
    "pydantic~=2.13",
    "psycopg2-binary~=2.9",
    "numpy~=2.5",
    "pyyaml~=6.0",
    "requests~=2.32",
]

[project.optional-dependencies]
test = [
    "basedpyright~=1.39",
    "hypothesis~=6.167",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-timeout~=2.4",
    "ruff~=0.16",
]
# Vision item authoring toolchain (itemrepo/vision): drawing primitives load
# lazily, so the core package never imports Pillow; install this extra to
# regenerate vision items.
vision = ["pillow~=12.1"]

[project.scripts]
hr = "hr.cli:app"

[tool.setuptools.packages.find]
include = ["hr*"]
exclude = ["hr.hr*"]

[tool.setuptools.data-files]
"share/aihr" = [
    "hr.toml.example",
]
"share/aihr/docker" = [
    "docker/docker-compose.yml",
]
"share/aihr/configs" = [
    "configs/deployable.yaml",
    "configs/fleet.yaml",
    "configs/knowledge.yaml",
    "configs/models.yaml",
    "configs/seats.yaml",
    "configs/thresholds.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--timeout=300"]
markers = [
    "db: requires live postgres (env/service-gated)",
    "integration: exercises real external resources (postgres)",
    "sandbox: executes model code under bubblewrap isolation (auto-skipped wherever bwrap cannot create namespaces)",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The tests register pytest fixtures by importing them into the module
# namespace (from tests.x import hr_env); the names are consumed by fixture
# injection, never by expressions, so every later binding reads to ruff as
# a redefinition of an "unused" import. Renaming the import would rename
# the fixture itself. F811 in tests/ is this idiom, not dead code.
"tests/**" = ["F811"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportImportCycles = false
reportMissingTypeArgument = false

[tool.coverage.run]
branch = true
source = ["hr"]

[tool.uv]
# Toolchain floor (owner ruling 2026-10-23): uv < 0.12 is rejected outright — the
# 0.11-era venv layout and the current lock handling are not forward-compatible
# (witnessed: dual-ruff drift + venv refusal on rebuild). No upper bound by design;
# lock-revision changes carry their own policy in scripts/check_universal.sh (e).
required-version = ">=0.12"
