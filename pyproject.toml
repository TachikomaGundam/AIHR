[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agent"
version = "0.2.0"
description = "HR Agent (人事) — model evaluation and role assignment for oh-my-openagent"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hr = "hr.cli:app"
hr2 = "hr.cli:app"  # compat alias — same app, not a copy

[tool.setuptools.packages.find]
include = ["hr*"]
exclude = ["hr.hr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]