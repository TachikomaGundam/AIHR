name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m compileall -q hr scripts itemrepo tests
      - run: ruff check hr scripts itemrepo
      - name: Type check (error-gate)
        run: |
          # basedpyright exits non-zero when ANY warning is present; the
          # repo's recommended-mode warning backlog is pre-existing and
          # tracked separately. Gate faithfully on ERRORS only (0 allowed)
          # and fail with a printed list otherwise.
          basedpyright --outputjson hr scripts > bp.json || true
          python - <<'PYEOF'
          import json, sys
          d = json.load(open("bp.json"))
          s = d["summary"]
          print(f"basedpyright: {s['errorCount']} errors, {s['warningCount']} warnings")
          if s["errorCount"]:
              for x in d["generalDiagnostics"]:
                  if x.get("severity") == "error":
                      line = x.get("range", {}).get("start", {}).get("line", 0)
                      print(f"{x.get('file','?')}:{line + 1}: {x['message'].splitlines()[0]}")
              sys.exit(1)
          PYEOF
      - name: Tests
        env:
          HR_TEST_PG_DSN: postgresql://hr:hr@localhost:5432/postgres
        run: python -m pytest --cov=hr --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - name: Universality gate
        run: bash scripts/check_universal.sh
      - run: python -m pip wheel --no-deps --wheel-dir dist .
