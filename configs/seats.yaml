# seats.yaml — the 18 oh-my-openagent seats (authoritative list; do not invent others)
# Fields per seat: seat_code, seat_name, domain, domain_specificity (0 general - 1 specialized),
# cost_tier / budget_tier: 'low' | 'mid' | 'high', required_capabilities (hard gates), ctx_p95,
# primary_capabilities (benchmark-category names used by hr.recommend for seat fit ranking).
# required_capabilities is a HARD GATE at assign time (spec §10.4): a model lacking any listed
# capability is ineligible for that seat regardless of fitness.
#
# calibration_anchors (top level): `key -> 'provider/model_id'` pairs for the stage-0 anchor
# calibration battery (spec §9.1, cheap/mid/expensive tiers). Loaded by hr.calibrate at runtime;
# a missing section is a FAIL-LOUD error naming this file. Anchors live here, not in
# configs/thresholds.yaml, because they are per-seat assignment policy (which seat tiers which
# anchor model), not numeric sweep thresholds.
#
# EXAMPLES ONLY — this tracked file ships with zero real deployment values.
# The REAL anchors for a live machine live in the gitignored
# configs/seats.local.yaml overlay (deep-merged by hr.config.load_yaml;
# local wins per key). First-install: `cp configs/seats.yaml
# configs/seats.local.yaml` and replace the example-provider/example-*
# values with your real anchors there. Never edit deployment values into
# this tracked file.

calibration_anchors:
  cheap: example-provider/example-model-a
  mid: example-provider/example-model-b
  expensive: example-provider/example-model-c

seats:
